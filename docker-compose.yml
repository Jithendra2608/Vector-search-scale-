version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: qdrant_bench_db
    ports:
      - "6333:6333" # REST API and Web UI
      - "6334:6334" # gRPC API (High-speed binary protocol)
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
